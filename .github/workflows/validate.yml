name: Validate sample

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_package.py
      - run: python -m unittest discover -s tests
      - run: python tools/validate_silver_data.py
      - run: python tools/setup_workshop.py --check-local
