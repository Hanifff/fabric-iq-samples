id: operations-hub
name: operations-hub
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    auth:
      type: application
    buildCommand: npm run build
  storage:
    enabled: false
connectors:
  - name: planning
    type: fabric-semanticmodel
    version: "1"
    config:
      workspaceId: YOUR-WORKSPACE-GUID
      itemId: YOUR-PLANNING-MODEL-GUID
    auth:
      type: delegated
    operations:
      - name: executeQuery
  - name: maintenance
    type: fabric-semanticmodel
    version: "1"
    config:
      workspaceId: YOUR-WORKSPACE-GUID
      itemId: YOUR-MAINTENANCE-MODEL-GUID
    auth:
      type: delegated
    operations:
      - name: executeQuery
  - name: procurement
    type: fabric-semanticmodel
    version: "1"
    config:
      workspaceId: YOUR-WORKSPACE-GUID
      itemId: YOUR-PROCUREMENT-MODEL-GUID
    auth:
      type: delegated
    operations:
      - name: executeQuery
